<svg width="100%" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000003"/>
      <stop offset="55%" stop-color="#02030c"/>
      <stop offset="100%" stop-color="#050a1f"/>
    </linearGradient>

    <radialGradient id="flameCore" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#d8feff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#5fd0ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#1454c4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#040818" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wisp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fe3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1c4dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smokeTurb" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="3" seed="11" result="noise">
        <animate attributeName="baseFrequency" values="0.012 0.05;0.02 0.06;0.012 0.05" dur="10s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- floating cursed-energy particles -->
  <g fill="#9fe8ff">
    <circle cx="120" cy="60" r="1.6" opacity="0.6">
      <animate attributeName="cy" values="60;30;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="80" r="1.4" opacity="0.5">
      <animate attributeName="cy" values="80;45;80" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="50" r="1.2" opacity="0.5">
      <animate attributeName="cy" values="50;20;50" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="40" r="1.3" opacity="0.4">
      <animate attributeName="cy" values="40;15;40" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- rising smoke wisps -->
  <g filter="url(#smokeTurb)">
    <ellipse cx="180" cy="320" rx="70" ry="160" fill="url(#wisp)">
      <animate attributeName="cy" values="320;-60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="420" cy="320" rx="55" ry="140" fill="url(#wisp)">
      <animate attributeName="cy" values="320;-50" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="760" cy="320" rx="60" ry="150" fill="url(#wisp)">
      <animate attributeName="cy" values="320;-55" dur="8.5s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="8.5s" begin="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1020" cy="320" rx="65" ry="155" fill="url(#wisp)">
      <animate attributeName="cy" values="320;-60" dur="10s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="10s" begin="2.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- base flame -->
  <rect x="0" y="190" width="1200" height="130" fill="url(#flameCore)" filter="url(#smokeTurb)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- flame tongues -->
  <g filter="url(#glow)">
    <path d="M 250 320 Q 235 230 260 200 Q 280 235 270 320 Z" fill="#bdf3ff" opacity="0.8">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.18;1 1" additive="sum" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 600 320 Q 580 215 615 175 Q 645 220 625 320 Z" fill="#bdf3ff" opacity="0.85">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.22;1 1" additive="sum" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 940 320 Q 925 230 950 200 Q 970 235 960 320 Z" fill="#bdf3ff" opacity="0.8">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.16;1 1" additive="sum" dur="2.3s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- name -->
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="4" fill="#eafdff" filter="url(#strongGlow)">
    YUVRAJ TAK
    <animate attributeName="fill" values="#eafdff;#86e6ff;#eafdff" dur="3.4s" repeatCount="indefinite"/>
  </text>

  <!-- tagline -->
  <text x="600" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" letter-spacing="3" fill="#7fd9ff" opacity="0.9">
    ENGINEERING INTELLIGENCE → BUILDING WORLDS
  </text>

  <!-- status line -->
  <text x="600" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#4f8fc4" opacity="0.85">
    domain: AI/ML internship @ Watsoo Express   ·   long-term: AI × game systems
  </text>
</svg>
