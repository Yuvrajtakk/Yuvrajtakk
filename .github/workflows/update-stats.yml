name: Update stats card

on:
  schedule:
    # 03:17 UTC daily — off-peak, avoids the GitHub API's busiest hours
    - cron: "17 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: Yuvrajtakk
        run: python scripts/generate_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh stats.svg [skip ci]"
            git push
          else
            echo "No change in stats.svg — skipping commit"
          fi
